[project]
name = "pwsync"
version = "0.1.0"
description = "Two-way password sync between KeePassXC (.kdbx) and Bitwarden"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pykeepass>=4.2,<5"]

[project.scripts]
pwsync = "pwsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwsync"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
